services:
  - type: web
    name: sleeper-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /tmp/sleeper_web.db
      # Secrets below are NOT stored in the repository.
      # sync: false means the value must be entered in the Render dashboard.
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: IMPRESSUM_NAME
        sync: false
      - key: IMPRESSUM_STREET
        sync: false
      - key: IMPRESSUM_CITY
        sync: false
      - key: IMPRESSUM_EMAIL
        sync: false
