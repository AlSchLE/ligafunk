services:
  - type: web
    name: sleeper-web
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      mkdir -p bin
      curl -fsSL -o /tmp/litestream.tar.gz https://github.com/benbjohnson/litestream/releases/download/v0.5.17/litestream-0.5.17-linux-x86_64.tar.gz
      echo "cfb371176d164437ae869f8351cfde49bd1804ae71c61923f75c9cba9c9c006d  /tmp/litestream.tar.gz" | sha256sum -c -
      tar -xzf /tmp/litestream.tar.gz -C bin litestream
      chmod +x bin/litestream
    startCommand: |
      if [ -z "$DATABASE_PATH" ] || [ -z "$LITESTREAM_BUCKET" ] || [ -z "$LITESTREAM_ENDPOINT" ] || [ -z "$LITESTREAM_REGION" ] || [ -z "$LITESTREAM_REPLICA_PATH" ] || [ -z "$LITESTREAM_ACCESS_KEY_ID" ] || [ -z "$LITESTREAM_SECRET_ACCESS_KEY" ]; then
        echo "ERROR: Litestream is not fully configured. Set all LITESTREAM_* variables in Render." >&2
        exit 1
      fi
      ./bin/litestream replicate -config litestream.yml -exec "gunicorn --timeout 180 app:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /tmp/sleeper_web.db
      # Litestream replicas the SQLite DB to a private S3-compatible bucket.
      # Bucket, endpoint and credentials are entered in the Render dashboard.
      - key: LITESTREAM_BUCKET
        sync: false
      - key: LITESTREAM_ENDPOINT
        sync: false
      - key: LITESTREAM_REGION
        value: auto
      - key: LITESTREAM_REPLICA_PATH
        value: ligafunk/sleeper_web.db
      - key: LITESTREAM_ACCESS_KEY_ID
        sync: false
      - key: LITESTREAM_SECRET_ACCESS_KEY
        sync: false
      - key: SESSION_LIFETIME_HOURS
        value: "24"
      - key: ADMIN_SESSION_HOURS
        value: "8"
      # Optional: uncomment to reject requests with an unexpected Host header.
      # Include every hostname that must serve the app.
      # - key: TRUSTED_HOSTS
      #   value: sleeper.schrader-leipzig.de,sleeper-web.onrender.com
      # Secrets below are NOT stored in the repository.
      # sync: false means the value must be entered in the Render dashboard.
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: IMPRESSUM_NAME
        sync: false
      - key: IMPRESSUM_STREET
        sync: false
      - key: IMPRESSUM_CITY
        sync: false
      - key: IMPRESSUM_EMAIL
        sync: false
