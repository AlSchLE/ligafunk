{% extends "base.html" %}
{% block title %}Share Recap — {{ league.name }}{% endblock %}

{% block content %}
<div class="card">
  <h1>📤 Share Recap</h1>
  <p class="tagline">{{ league.name }} — Week {{ recap.week }}</p>

  <div class="share-options">
    <a href="{{ whatsapp_url }}" target="_blank" rel="noopener noreferrer" class="btn-share whatsapp">
      <span class="share-icon">📱</span>
      <span>WhatsApp</span>
    </a>

    <button type="button" data-copy="{{ recap_text }}" class="btn-share signal">
      <span class="share-icon">📋</span>
      <span>Copy for Signal</span>
    </button>

    <button type="button" data-copy="{{ recap_url }}" class="btn-share link">
      <span class="share-icon">🔗</span>
      <span>Copy Link</span>
    </button>

    <button type="button" data-copy="{{ recap.content }}" class="btn-share text">
      <span class="share-icon">📄</span>
      <span>Copy Text</span>
    </button>

    {% for hook in webhooks %}
      <button type="button"
              data-webhook-endpoint="{{ url_for('webhook_post', league_code=league.league_code, recap_id=recap.id) }}"
              data-webhook-type="{{ hook.webhook_type }}"
              class="btn-share webhook">
        <span class="share-icon">🚀</span>
        <span>Post to {{ hook.webhook_type|capitalize }}</span>
      </button>
    {% endfor %}

    <a href="mailto:?subject={{ (league.name ~ ' — Week ' ~ recap.week ~ ' Recap')|urlencode }}&body={{ recap_text|urlencode }}" class="btn-share email">
      <span class="share-icon">📧</span>
      <span>E-Mail</span>
    </a>
  </div>

  <div class="card share-card">
    <h3>Recap URL</h3>
    <code class="recap-url">{{ recap_url }}</code>
    <button type="button" data-copy="{{ recap_url }}" class="btn-small copy-inline">📋 Copy</button>
  </div>

  <a href="{{ url_for('league_recap', league_code=league.league_code, recap_id=recap.id) }}" class="btn">← Back to Recap</a>
</div>
{% endblock %}
