{% extends "base.html" %}
{% block title %}New Recap — {{ team.name }}{% endblock %}

{% block content %}
<section class="page-head">
  <div class="avatar avatar-xl avatar-3" aria-hidden="true">{{ team.name[:2]|upper }}</div>
  <div class="page-head-copy">
    <span class="eyebrow">{{ league.name }}</span>
    <h1>New recap</h1>
    <p>{{ team.name }} · Write it yourself or start from a generated draft.</p>
  </div>
  <div class="page-head-actions">
    <a href="{{ url_for('team_dashboard', league_code=league.league_code) }}" class="btn btn-ghost">← Back to dashboard</a>
  </div>
</section>

<section class="card">
  <form method="post">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
    <div class="recap-form-grid">
      <div class="form-group">
        <label for="recap-week">Week</label>
        <input id="recap-week" type="number" name="week" required min="1" max="22" placeholder="e.g. 7">
      </div>
      <div class="form-group">
        <label for="recap-style">Style</label>
        <select id="recap-style" name="style">
          {% for sid, meta in recap_styles.items() %}
            <option value="{{ sid }}">{{ meta.emoji }} {{ meta.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label for="recap-theme">Theme</label>
        <select id="recap-theme" name="theme">
          {% for tid, meta in recap_themes.items() %}
            <option value="{{ tid }}">{{ meta.emoji }} {{ meta.name }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="form-group">
      <label for="recap-content">Recap content</label>
      <textarea id="recap-content" name="content" rows="15" required maxlength="50000"
                placeholder="Paste or write your recap here..."></textarea>
    </div>
    <div class="card-actions">
      <button type="submit" class="btn">Save recap</button>
      <a href="{{ url_for('team_dashboard', league_code=league.league_code) }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
